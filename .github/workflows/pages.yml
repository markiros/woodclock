# Веб-демо на GitHub Pages: tools/web/index.html + PNG пресетов из WoodClock/Presets.
name: Pages
on:
  push:
    branches: [main]
    paths: ['tools/web/**', 'WoodClock/Presets/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Сборка сайта
        run: |
          mkdir -p _site
          # index.html в репозитории — тело страницы без обёртки (так его публикует claude.ai artifact)
          { printf '<!doctype html>\n<html lang="ru">\n<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1">\n'
            cat tools/web/index.html; } > _site/index.html
          cp -R WoodClock/Presets _site/presets
          touch _site/.nojekyll
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
      - id: deploy
        uses: actions/deploy-pages@v5
